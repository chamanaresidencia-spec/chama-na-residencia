<!DOCTYPE html>
<html lang="pt-BR" class="bg-slate-950 text-slate-200">
<head>
    <meta charset="UTF-8">
    <title>Chama na Residência | Obstetrícia Completa</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-4 md:p-8">
    <main class="max-w-5xl mx-auto">
        <h1 class="text-3xl font-bold text-cyan-400 mb-6">Módulo: Síndromes Hipertensivas</h1>
        
        <section class="mb-10">
            <h2 class="text-xl font-bold mb-4 text-cyan-300">100 Flashcards (Padrão Osler)</h2>
            <div class="grid grid-cols-2 md:grid-cols-5 gap-2 text-[10px] md:text-xs">
                <!-- Gere 100 blocos abaixo -->
                <script>
                    for(let i=1; i<=100; i++) {
                        document.write(`<div class="h-16 bg-slate-800 p-1 flex items-center justify-center text-center rounded border border-slate-700 cursor-pointer hover:bg-cyan-900 transition" onclick="alert('Resposta ${i}')">Card ${i}</div>`);
                    }
                </script>
            </div>
        </section>

        <section>
            <h2 class="text-xl font-bold mb-4 text-cyan-300">30 Questões Comentadas</h2>
            <div class="space-y-3">
                <script>
                    for(let i=1; i<=30; i++) {
                        document.write(`<div class="bg-slate-800 p-4 rounded border border-slate-700"><p><strong>Questão ${i}:</strong> Enunciado da questão de obstetrícia aqui...</p><details class="text-cyan-400 cursor-pointer mt-2"><summary>Ver Comentário</summary><p class="text-slate-200">Comentário detalhado da questão ${i} sobre diretrizes obstétricas.</p></details></div>`);
                    }
                </script>
            </div>
        </section>
    </main>
</body>
</html>
