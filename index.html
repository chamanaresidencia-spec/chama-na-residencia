<script>
        // 10 Flashcards Preenchidos
        const cards = [
            "Definição PE: PA ≥ 140/90 após 20 sem + proteinúria ou disfunção orgânica?",
            "Dose ataque Pritchard: 4g EV lento + 10g IM?",
            "Antídoto do MgSO4: Gluconato de Cálcio 10%?",
            "Tríade da Síndrome HELLP: Hemólise, Enzimas elevadas, Plaquetopenia?",
            "Meta da PA na crise hipertensiva: 140-150/90-100 mmHg?",
            "Droga de escolha na crise hipertensiva: Hidralazina ou Nifedipino?",
            "Sinal de iminência de eclâmpsia: Cefaleia, escotomas, dor epigástrica?",
            "Dose manutenção MgSO4: 1g/h em bomba de infusão?",
            "Duração do tratamento após parto na PE: 24-48 horas?",
            "Quando indicar parto na PE grave: ≥ 34 semanas ou instabilidade?"
        ];

        const container = document.getElementById('flashcards');
        cards.forEach((c, i) => {
            container.innerHTML += `<div class="h-20 bg-slate-800 p-2 flex items-center justify-center text-center rounded border border-cyan-700 cursor-pointer hover:bg-cyan-900 text-xs" onclick="alert('${c.split('?')[1] || 'Verifique o material de leitura'}')">${c}</div>`;
        });

        // 10 Questões Preenchidas
        const quest = [
            "Q1: Gestante 32 sem, PA 170/110. Conduta? | Resposta: Estabilização (Hidralazina) + MgSO4 + Parto.",
            "Q2: Qual o achado no HELLP que indica risco de rotura hepática? | Resposta: Dor em hipocôndrio direito.",
            "Q3: Como monitorar toxicidade do MgSO4? | Resposta: Reflexo patelar (1º a sumir), FR e diurese.",
            "Q4: O que define PE com sinais de gravidade? | Resposta: PA >= 160/110 ou disfunção de órgão-alvo.",
            "Q5: Qual a causa de morte na eclâmpsia? | Resposta: Edema cerebral e hemorragia intracraniana.",
            "Q6: Quando suspender o MgSO4? | Resposta: Se FR < 16, ausência de reflexo patelar ou diurese < 25ml/h.",
            "Q7: Existe benefício de MgSO4 na HAS Crônica isolada? | Resposta: Não, apenas se houver sobreposição de PE.",
            "Q8: Qual o risco do uso de Nifedipino sublingual? | Resposta: Queda súbita da PA com hipoperfusão placentária.",
            "Q9: Como é o diagnóstico de proteinúria isolada? | Resposta: >= 300mg em urina de 24h ou relação proteína/creatinina >= 0,3.",
            "Q10: O que fazer na eclampsia refratária? | Resposta: Adicionar dose extra de MgSO4 ou Diazepam/Fenitoína."
        ];
        
        const qContainer = document.getElementById('questoes');
        quest.forEach(q => {
            let [pergunta, resposta] = q.split('|');
            qContainer.innerHTML += `<div class="bg-slate-800 p-4 rounded border border-slate-700"><p><strong>${pergunta}</strong></p><details class="text-cyan-400 cursor-pointer mt-2"><summary>Ver Comentário</summary><p class="text-slate-200">${resposta}</p></details></div>`;
        });
    </script>
